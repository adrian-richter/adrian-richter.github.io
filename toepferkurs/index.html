<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Töpferkurs">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="TÖPFERKURS – die herrlich chaotische WG-Zentrale von Ben & Adrian.">
  <title>TÖPFERKURS 🏠 · Ben & Adrian</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=3">
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Töpferkurs Startseite">
        <span class="brand-mark">🏺</span>
        <span><strong>TÖPFERKURS<span class="brand-dot">.</span></strong><small>DIE WG-ZENTRALE</small></span>
      </a>
      <div class="header-right">
        <span class="schleswig-stamp">📍 SCHLESWIG EDITION</span>
        <button class="round-btn" data-action="backup" aria-label="Daten sichern oder laden" title="Daten sichern">💾</button>
        <button class="round-btn" data-action="about" aria-label="Infos zur App" title="Infos zur App">❔</button>
      </div>
    </header>
    <nav class="navigation" aria-label="Hauptmenü">
      <button class="nav-item active" data-page="home"><span>🏠</span><span>Home</span></button>
      <button class="nav-item" data-page="shopping"><span>🛒</span><span>Einkaufen</span><b id="nav-shop-count" class="nav-pill hidden">0</b></button>
      <button class="nav-item" data-page="pantry"><span>🥫</span><span>Vorräte</span></button>
      <button class="nav-item" data-page="calendar"><span>🗓️</span><span>Kalender</span></button>
      <button class="nav-item" data-page="chores"><span>🧹</span><span>Putzclub</span></button>
      <button class="nav-item" data-page="money"><span>💸</span><span>Kasse</span></button>
    </nav>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>MADE FOR TWO CHAOTIC LEGENDS ✌️</span><span>Töpferkurs · Ben & Adrian · 2026</span></footer>
  </div>
  <div id="modal" class="modal-root hidden" role="presentation">
    <div class="modal-scrim" data-action="close-modal"></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-action="close-modal" aria-label="Schließen">✕</button>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
</body>
</html>
